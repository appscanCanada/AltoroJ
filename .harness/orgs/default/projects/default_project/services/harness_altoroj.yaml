service:
  name: harness_altoroj
  identifier: harness_altoroj
  orgIdentifier: default
  projectIdentifier: default_project
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: altoroj
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: appscanCanada
                  gitFetchType: Branch
                  paths:
                    - k8s/
                  branch: AltoroJ-3.2
              skipResourceVersioning: false
              enableDeclarativeRollback: false
    type: Kubernetes
