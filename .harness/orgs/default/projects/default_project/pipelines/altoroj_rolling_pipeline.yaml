pipeline:
  name: altoroj_rolling_pipeline
  identifier: altoroj_rolling_pipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: build-and-deploy-docker
        identifier: buildanddeploydocker
        description: Build and deploy AltoroJ as a Docker container on the delegate host
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Clone Repository
                  identifier: cloneRepository
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "Cloning AltoroJ repository..."
                          rm -rf /tmp/altoroj-build
                          git clone --branch AltoroJ-3.2 https://github.com/appscanCanada/AltoroJ.git /tmp/altoroj-build
                          echo "Repository cloned successfully"
                          ls -la /tmp/altoroj-build
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
              - step:
                  name: Build Docker Image
                  identifier: buildDockerImage
                  type: ShellScript
                  timeout: 15m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "Building Docker image..."
                          cd /tmp/altoroj-build

                          # Build the Docker image
                          docker build -t 192.168.69.115:5443/altoroj:1.0 .

                          echo "Docker image built successfully"
                          docker images | grep altoroj
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
              - step:
                  name: Deploy Container
                  identifier: deployContainer
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "Deploying AltoroJ container..."

                          # Stop and remove existing container if it exists
                          docker stop altoroj 2>/dev/null || true
                          docker rm altoroj 2>/dev/null || true

                          # Run the new container
                          docker run -d \
                            --name altoroj \
                            --restart unless-stopped \
                            -p 8080:8080 \
                            192.168.69.115:5443/altoroj:1.0

                          # Wait for container to start
                          sleep 20

                          # Verify container is running
                          if docker ps | grep -q altoroj; then
                            echo "AltoroJ container is running successfully"
                            echo "Access the application at http://<delegate-host>:8080"
                            docker ps | grep altoroj
                          else
                            echo "ERROR: Container failed to start"
                            docker logs altoroj
                            exit 1
                          fi
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
              - step:
                  name: Health Check
                  identifier: healthCheck
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "Performing health check..."

                          # Wait for app to be ready
                          MAX_RETRIES=12
                          RETRY_COUNT=0

                          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 | grep -q "200\|302"; then
                              echo "Health check passed! AltoroJ is responding."
                              curl -I http://127.0.0.1:8080 2>/dev/null | head -5
                              exit 0
                            fi
                            echo "Waiting for AltoroJ to be ready... (attempt $((RETRY_COUNT+1))/$MAX_RETRIES)"
                            sleep 5
                            RETRY_COUNT=$((RETRY_COUNT+1))
                          done

                          echo "WARNING: Health check did not get a 200/302 response, but container may still be starting"
                          docker logs altoroj --tail 20
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - docker-delegate
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
